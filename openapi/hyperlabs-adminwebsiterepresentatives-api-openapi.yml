        link:
          title: String
          type:
          - string
          - 'null'
        isOther:
          title: Boolean
          type: boolean
        phones:
          title: String[]
          type:
          - array
          - 'null'
          items:
            title: String
            type: string
        emails:
          title: String[]
          type:
          - array
          - 'null'
          items:
            title: String
            type: string
        workingTime:
          title: String
          type:
          - string
          - 'null'
        territories:
          title: String[]
          type:
          - array
          - 'null'
          items:
