openapi: 3.2.0
info:
  title: Hyperlabs.Web Admin Website Events API
  version: '1.0'
servers:
- url: /api
tags:
- name: AdminWebsiteEvents
paths:
  /v1/admin/website/events:
    get:
      tags:
      - AdminWebsiteEvents
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Get admin website events
      x-summary-source: derived
      operationId: getV1AdminWebsiteEvents
      x-operation-id-source: derived
    post:
      tags:
      - AdminWebsiteEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Create admin website events
      x-summary-source: derived
      operationId: postV1AdminWebsiteEvents
      x-operation-id-source: derived
  /v1/admin/website/events/{id}:
    get:
      tags:
      - AdminWebsiteEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Get admin website events by id
      x-summary-source: derived
      operationId: getV1AdminWebsiteEventsById
      x-operation-id-source: derived
    put:
      tags:
      - AdminWebsiteEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Replace admin website events by id
      x-summary-source: derived
      operationId: putV1AdminWebsiteEventsById
      x-operation-id-source: derived
    delete:
      tags:
      - AdminWebsiteEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Delete admin website events by id
      x-summary-source: derived
      operationId: deleteV1AdminWebsiteEventsById
      x-operation-id-source: derived
components:
  schemas:
    Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteEventDto:
      title: ChangeWebsiteEventDto
      type: object
      properties:
        name:
          title: String
          type:
          - string
          - 'null'
        link:
          title: String
          type:
          - string
          - 'null'
        startDate:
          title: DateTimeOffset
          type: string
          format: date-time
        endDate:
          title: DateTimeOffset
          type: string
          format: date-time
        timeZoneId:
          title: String
          type:
          - string
          - 'null'
        location:
          title: String
          type:
          - string
          - 'null'
        isActive:
          title: Boolean
          type: boolean
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
