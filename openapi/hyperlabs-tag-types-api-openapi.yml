openapi: 3.2.0
info:
  title: Hyperlabs.Web Tag Types API
  version: '1.0'
servers:
- url: /api
tags:
- name: Tag Types
paths:
  /v1/tags:
    get:
      tags:
      - Tag Types
      parameters:
      - name: TagTypeIds
        in: query
        schema:
          title: Guid[]
          type: array
          items:
            title: Guid
            type: string
            format: uuid
      responses:
        '200':
          description: OK
      summary: Get tags
      x-summary-source: derived
      operationId: getV1Tags
      x-operation-id-source: derived
  /v1/tags/{id}:
    get:
      tags:
      - Tag Types
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      summary: Get tags by id
      x-summary-source: derived
      operationId: getV1TagsById
      x-operation-id-source: derived
  /v1/admin/tag-types:
    get:
      tags:
      - Tag Types
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Get admin tag types
      x-summary-source: derived
      operationId: getV1AdminTagTypes
      x-operation-id-source: derived
    post:
      tags:
      - Tag Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Create admin tag types
      x-summary-source: derived
      operationId: postV1AdminTagTypes
      x-operation-id-source: derived
  /v1/admin/tag-types/{id}:
    put:
      tags:
      - Tag Types
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Replace admin tag types by id
      x-summary-source: derived
      operationId: putV1AdminTagTypesById
      x-operation-id-source: derived
    delete:
      tags:
      - Tag Types
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Delete admin tag types by id
      x-summary-source: derived
      operationId: deleteV1AdminTagTypesById
      x-operation-id-source: derived
  /v1/admin/tag-types/{id}/move:
    post:
      tags:
      - Tag Types
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Shared.MoveDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Shared.MoveDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Shared.MoveDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      summary: Create admin tag types by id move
      x-summary-source: derived
      operationId: postV1AdminTagTypesByIdMove
      x-operation-id-source: derived
components:
  schemas:
    Hyperlabs.Web.Areas.Admin.Models.TagTypes.ChangeTagTypeDto:
      title: ChangeTagTypeDto
      type: object
      properties:
        name:
          title: String
          type:
          - string
          - 'null'
        title:
          title: String
          type:
          - string
          - 'null'
        subtitle:
          title: String
          type:
          - string
          - 'null'
        description:
          title: String
          type:
          - string
          - 'null'
        publishingStatusCode:
          $ref: '#/components/schemas/Hyperlabs.Domain.Products.Models.PublishingStatusCode'
      additionalProperties: false
    Hyperlabs.Domain.Products.Models.PublishingStatusCode:
      title: PublishingStatusCode
      enum:
      - 1
      - 2
      - 3
      type: integer
      format: int32
    Hyperlabs.Web.Areas.Admin.Models.Shared.MoveDto:
      title: MoveDto
      type: object
      properties:
        delta:
          title: Int32
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
