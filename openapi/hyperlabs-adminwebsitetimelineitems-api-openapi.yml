      type: object
      properties:
        isNow:
          title: Boolean
          type: boolean
        date:
          title: Nullable`1
          type:
          - string
          - 'null'
          format: date
        title:
          title: String
          type:
          - string
          - 'null'
        description:
          title: String
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
