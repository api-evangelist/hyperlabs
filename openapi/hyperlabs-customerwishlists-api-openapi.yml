openapi: 3.2.0
info:
  title: Hyperlabs.Web Customer Wishlists API
  version: '1.0'
servers:
- url: /api
tags:
- name: CustomerWishlists
paths:
  /v1/customer/wishlist:
    get:
      tags:
      - CustomerWishlists
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
  /v1/customer/wishlist/item:
    post:
      tags:
      - CustomerWishlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.AddWishlistItemDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.AddWishlistItemDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.AddWishlistItemDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
  /v1/customer/wishlist/item/{id}:
    delete:
      tags:
      - CustomerWishlists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
    put:
      tags:
      - CustomerWishlists
      parameters:
      - name: id
        in: path
        required: true
        schema:
          title: Guid
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.ChangeWishlistItemAmountDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.ChangeWishlistItemAmountDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.ChangeWishlistItemAmountDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
  /v1/customer/wishlist/quote:
    post:
      tags:
      - CustomerWishlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerSendWishlistQuoteDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerSendWishlistQuoteDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerSendWishlistQuoteDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
  /v1/customer/wishlist/share:
    post:
      tags:
      - CustomerWishlists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerShareWishlistDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerShareWishlistDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerShareWishlistDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
components:
  schemas:
    Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerShareWishlistDto:
      title: CustomerShareWishlistDto
      type: object
      properties:
        email:
          title: String
          type:
          - string
          - 'null'
        message:
          title: String
          type:
          - string
          - 'null'
        recaptchaToken:
          title: String
          type:
          - string
          - 'null'
      additionalProperties: false
    Hyperlabs.Web.Areas.Customer.Models.Wishlists.AddWishlistItemDto:
      title: AddWishlistItemDto
      type: object
      properties:
        productId:
          title: Guid
          type: string
          format: uuid
        productUnitId:
          title: Nullable`1
          type:
          - string
          - 'null'
          format: uuid
        amount:
          title: Int32
          type: integer
          format: int32
      additionalProperties: false
    Hyperlabs.Web.Areas.Customer.Models.Wishlists.CustomerSendWishlistQuoteDto:
      title: CustomerSendWishlistQuoteDto
      type: object
      properties:
        recaptchaToken:
          title: String
          type:
          - string
          - 'null'
      additionalProperties: false
    Hyperlabs.Web.Areas.Customer.Models.Wishlists.ChangeWishlistItemAmountDto:
      title: ChangeWishlistItemAmountDto
      type: object
      properties:
        amount:
          title: Int32
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
