openapi: 3.2.0
info:
  title: Hyperlabs.Web Admin Website Banner API
  version: '1.0'
servers:
- url: /api
tags:
- name: AdminWebsiteBanner
paths:
  /v1/admin/website/banner:
    get:
      tags:
      - AdminWebsiteBanner
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
    post:
      tags:
      - AdminWebsiteBanner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteBannerDto'
          text/json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteBannerDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteBannerDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
components:
  schemas:
    Hyperlabs.Web.Areas.Admin.Models.Website.ChangeWebsiteBannerDto:
      title: ChangeWebsiteBannerDto
      type: object
      properties:
        isActive:
          title: Boolean
          type: boolean
        text:
          title: String
          type:
          - string
          - 'null'
        url:
          title: String
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
