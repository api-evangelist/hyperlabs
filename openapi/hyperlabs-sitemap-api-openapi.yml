openapi: 3.2.0
info:
  title: Hyperlabs.Web Sitemap API
  version: '1.0'
servers:
- url: /api
tags:
- name: Sitemap
paths:
  /v1/sitemap/sitemap.xml:
    get:
      tags:
      - Sitemap
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "Bearer {token}"'
      name: Authorization
      in: header
