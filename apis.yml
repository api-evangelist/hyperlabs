- name: HYPERLABS Radium gRPC API (TDR11100)
  description: >-
    Public gRPC control and acquisition interface for the HYPERLABS TDR11100 Time Domain Reflectometer.
    The proto3 service radium.v1.Radium exposes 22 unary RPCs covering readiness and board state, reset,
    LED control, board temperature, TDR enable/preset configuration, acquisition-filter configuration,
    license management, and T0 / calibration-region offsets, plus 3 server-streaming RPCs that emit an
    open-ended stream of state events, LED state and waveform sample packets. The service listens on TCP
    port 50052 on the instrument itself over an insecure (plaintext, unauthenticated) channel, so the
    contract is device-local rather than internet-facing. HYPERLABS publishes the .proto, the generated
    Python bindings and a worked Python capture example under an MIT license on its GitHub organization.
  humanURL: https://github.com/HYPERLABS/TDR11100
  x-transport: grpc
  x-endpoint: '{instrument-ip}:50052'
  x-note: >-
    No public baseURL — the Radium service runs on the customer's own TDR11100 hardware and is reached
    at the instrument's IP address on TCP 50052. Recorded honestly rather than substituted with a
    placeholder host.
  tags:
  - grpc
  - instrumentation
  - time-domain-reflectometry
  - streaming
  - test-and-measurement
  properties:
  - type: Protobuf
    url: grpc/hyperlabs-radium.proto
  - type: SourceCode
    url: https://github.com/HYPERLABS/TDR11100
  - type: AsyncAPI
    url: asyncapi/hyperlabs-radium-asyncapi.yml
  - type: Examples
    url: https://github.com/HYPERLABS/TDR11100/raw/main/gRPC_Sample_Script.zip
