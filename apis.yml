apis:
- name: HYPERLABS Web API
  description: >-
    The ASP.NET Core backend that powers www.hyperlabs.com — product catalog, product classes,
    categories, tags and filtering, application notes, datasheets, software/DLL downloads, website
    content (banner, events, FAQs, team, timeline, sales representatives, sales-and-warranty terms),
    customer accounts with Google and Microsoft sign-in, customer wishlists, quote requests and contact
    messages, plus an authenticated admin surface. The OpenAPI 3.0.1 definition and a Swagger UI are
    served publicly from the API host. It is not marketed as a developer product and carries no
    published terms of use for third-party consumption.
  humanURL: https://www.hyperlabs.com/api/swagger/index.html
  baseURL: https://www.hyperlabs.com/api
  tags:
