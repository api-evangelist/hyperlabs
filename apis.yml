aid: hyperlabs
name: HYPERLABS
description: >-
  HYPERLABS, Inc. designs and manufactures signal-integrity products for high-speed digital and datacom
  test in the United States. Two product classes: ultra-broadband Components (amplifiers, baluns, DC
  blocks, bias tees, pick-off tees, power dividers, attenuators, terminations, inverters) built for 112
  and 224 Gbps PAM-4 applications, and Instruments — USB-powered and USB-controlled TDRs, Signal Path
  Analyzers, controlled-impedance analyzers and impulse generators with 1-20 channels and rise times as
  fast as 35 ps. Founded in 1992, with engineering and manufacturing in Louisville, Colorado and
  Beaverton, Oregon. HYPERLABS publishes two machine-readable contracts: an OpenAPI 3.0.1 definition
  (175 operations, served with Swagger UI) for the hyperlabs.com product-catalog and customer web
  backend, and an MIT-licensed proto3 gRPC service definition, radium.v1.Radium, for programmatic
  control and waveform streaming from the TDR11100 Time Domain Reflectometer. Instrument automation is
  also offered as first-party Windows DLL packages (ZTDR and XTDR) with C++ sample source and manuals.
