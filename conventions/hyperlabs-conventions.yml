  anonymous_operations: 54
  protected_operations: 121
  detail: authentication/hyperlabs-authentication.yml
  grpc: none — the sample client opens grpc.insecure_channel(), so the instrument service is plaintext and unauthenticated on the local network.
idempotency:
  supported: false
  header: null
  notes: >-
    No Idempotency-Key header, parameter or extension appears anywhere in the 175-operation spec, and
    no retry-safety contract is documented. Write operations (quote requests, contact messages,
    wishlist items) are not idempotent. No `Idempotency` pointer is emitted for this provider.
pagination:
  style: page-number
  supported_on: >-
    Four collection endpoints (admin products, media files, datasheets, users). The public catalog
    endpoints (/v1/products, /v1/product-classes, /v1/categories, /v1/software, /v1/tags) return whole
    unpaged arrays.
  request_params:
  - {name: PageNo, in: query, type: integer}
  - {name: PageSize, in: query, type: integer}
  - {name: SortBy, in: query, type: string, note: bound to a per-resource *QuerySortParameter enum}
  - {name: SortDesc, in: query, type: boolean}
  - {name: Search, in: query, type: string}
  response_fields: unspecified — the spec declares no response schema for these operations
filtering:
  style: repeated-uuid-query-params
  examples:
  - 'GET /v1/products?ProductClassIds=&CategoryIds=&TagIds=&SoftwareIds=&IsNew=&IsFeatured=&IsPromoted='
  - 'POST /v1/products/filter with FilterDto {productClassIds[], categoryIds[], parameters[]}'
  - GET /v1/products/filter/parameters — returns the filterable parameter set for a selection
  notes: >-
    A two-step faceted-search contract: read the available filter parameters, then post the selected
    ones. FilterParameterCode is an enum in the spec.
