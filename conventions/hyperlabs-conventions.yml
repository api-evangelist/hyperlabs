authentication:
  style: bearer-token
  header: 'Authorization: Bearer {token}'
  declared_as: >-
    The OpenAPI securityScheme is named "oauth2" but is declared as type apiKey in the Authorization
    header — a bearer JWT, not an OAuth 2.0 flow. No authorizationUrl, tokenUrl or scopes are declared.
  token_issue:
