grpc_model:
  source: grpc/hyperlabs-radium.proto
  notes: >-
    The instrument surface is not entity-oriented — it is a device state machine. The nearest thing to
    entities are the state messages: StateEvent, LedState, SampleStream (the waveform packet),
    CalRegionOffsets, plus the TDR configuration and acquisition-filter configuration read back by
    GetTDRConfiguration and GetAcquisitionFilterConfiguration.
